<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esquiva Asteroides</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            background-color: #000;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #0ff;
            font-size: 22px;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 0 8px rgba(0,255,255,0.5);
        }
        #ui .dif {
            color: #ff8844;
            font-size: 16px;
            display: block;
            margin-top: 4px;
        }
        #menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
            z-index: 200;
        }
        #menu h1 {
            color: #0ff;
            font-size: 52px;
            margin: 0;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.6);
        }
        #menu p {
            color: #888;
            font-size: 18px;
            margin: 0;
        }
        #menu button {
            padding: 14px 36px;
            font-size: 20px;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            border: 2px solid #0ff;
            background: transparent;
            color: #0ff;
            border-radius: 5px;
            transition: all 0.2s;
        }
        #menu button:hover {
            background: #0ff;
            color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
        }
        #game-over {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #ff0055;
            padding: 40px;
            border-radius: 10px;
            color: #ff0055;
            z-index: 100;
            text-align: center;
        }
        #game-over h1 { font-size: 48px; margin: 0; }
        #game-over p { font-size: 24px; color: #fff; }
        #game-over button {
            margin-top: 20px; padding: 12px 28px; font-size: 18px;
            font-family: inherit; cursor: pointer; background: #ff0055;
            color: white; border: none; border-radius: 5px; transition: all 0.2s;
        }
        #game-over button:hover { background: #ff3377; box-shadow: 0 0 15px rgba(255, 0, 85, 0.4); }
        #controls-hint {
            position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%); color: #555; font-size: 14px;
            z-index: 10; pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="menu">
        <h1>ESQUIVA<br>ASTEROIDES</h1>
        <p>Flechas para mover | Espacio para disparar</p>
        <button onclick="startGame()">JUGAR</button>
    </div>

    <div id="ui">Puntuación: <span id="score">0</span><span class="dif" id="dif">Nivel 1</span></div>
    <div id="controls-hint">Flechas: mover | Espacio: disparar</div>

    <div id="game-over">
        <h1>¡CHE, PERDISTE!</h1>
        <p>Puntaje final: <span id="final-score">0</span></p>
        <button onclick="restartGame()">REINTENTAR</button>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const finalScoreElement = document.getElementById('final-score');
        const menu = document.getElementById('menu');
        const difEl = document.getElementById('dif');

        canvas.width = 800;
        canvas.height = 600;

        let score = 0;
        let gameActive = false;
        let gameState = 'menu';

        // Audio
        const laserSound = new Audio('laser-shot-fx_150bpm.wav');
        laserSound.volume = 0.3;
        const explosionSound = new Audio('lumora_studios-pixel-explosion-319166.mp3');
        explosionSound.volume = 0.4;
        const bgMusic = new Audio('freesound_community-pixel-sound-effect-4-82881.mp3');
        bgMusic.volume = 0.15;
        bgMusic.loop = true;

        // Player
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 80,
            size: 20,
            speed: 0.9,
            vx: 0,
            rotation: 0
        };

        const bullets = [];
        const asteroids = [];
        const particles = [];

        // Dificultad
        let elapsed = 0;
        let level = 1;
        let spawnInterval = 1500;
        let baseSpeed = 2;
        let lastAsteroidTime = 0;
        let lastShootTime = 0;
        const shootCooldown = 150;

        function updateDifficulty(dt) {
            elapsed += dt / 1000;
            const newLevel = Math.floor(elapsed / 12) + 1;
            if (newLevel !== level) {
                level = newLevel;
                difEl.innerText = 'Nivel ' + level;
            }
            // Aumenta la velocidad base
            const speedScale = 1 + (level - 1) * 0.15;
            baseSpeed = 2 + (level - 1) * 0.4;
            // Reduce el intervalo (mínimo 500ms)
            const minInterval = Math.max(500, 1500 - (level - 1) * 150);
            spawnInterval = minInterval;
            // Más asteroides por fila
            return Math.min(level, 6);
        }

        function createAsteroidRow() {
            const count = Math.min(3 + Math.floor((level - 1) / 2), 6);
            const spacing = canvas.width / (count + 1);

            // Patrón que obliga a moverse: offsets horizontales aleatorios
            // + ángulo de caída que varía
            const offsetPattern = [
                0, 0.3, -0.2, 0.5, -0.4, 0.1
            ];

            for (let i = 1; i <= count; i++) {
                const size = Math.random() * 25 + 12;
                const baseX = i * spacing;

                // Offset horizontal para forzar movimiento lateral
                const offsetX = (offsetPattern[(i + Math.floor(elapsed / 3)) % offsetPattern.length]) * spacing * 0.3;

                // Ángulo de caída: no solo hacia abajo, también lateral
                const angle = (Math.random() - 0.5) * 0.6; // -0.3 a 0.3 rad
                const speed = baseSpeed * (0.8 + Math.random() * 0.6);

                asteroids.push({
                    x: baseX + offsetX,
                    y: -50,
                    size: size,
                    speed: speed,
                    angle: angle,
                    vx: Math.sin(angle) * speed,
                    vy: Math.cos(angle) * speed,
                    rotation: Math.random() * Math.PI * 2,
                    rotationSpeed: (Math.random() - 0.5) * 0.08,
                    points: Array.from({ length: 10 }, (_, i) => ({
                        x: (Math.cos(i * (Math.PI * 2 / 10)) + (Math.random() - 0.5) * 0.5) * size,
                        y: (Math.sin(i * (Math.PI * 2 / 10)) + (Math.random() - 0.5) * 0.5) * size
                    }))
                });
            }
        }

        // Partículas de explosión
        const colors = ['#ff4400', '#ff8800', '#ffcc00', '#ffff00', '#ffffff', '#ff2222'];

        function spawnExplosion(x, y, count, size) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 1;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1.0,
                    decay: 0.02 + Math.random() * 0.03,
                    size: Math.random() * (size * 0.5) + 2,
                    color: colors[Math.floor(Math.random() * colors.length)]
                });
            }
        }

        function shoot() {
            if (!gameActive) return;
            const now = Date.now();
            if (now - lastShootTime < shootCooldown) return;
            lastShootTime = now;

            bullets.push({
                x: player.x,
                y: player.y - player.size - 5,
                vy: -9,
                size: 4
            });

            laserSound.currentTime = 0;
            laserSound.play().catch(e => {});
        }

        function startGame() {
            score = 0;
            gameActive = true;
            gameState = 'playing';
            bullets.length = 0;
            asteroids.length = 0;
            particles.length = 0;
            player.x = canvas.width / 2;
            player.y = canvas.height - 80;
            player.vx = 0;
            player.rotation = 0;
            lastAsteroidTime = 0;
            lastShootTime = 0;
            elapsed = 0;
            level = 1;
            baseSpeed = 2;
            spawnInterval = 1500;
            scoreElement.innerText = '0';
            difEl.innerText = 'Nivel 1';

            menu.style.display = 'none';
            gameOverScreen.style.display = 'none';

            bgMusic.currentTime = 0;
            bgMusic.play().catch(e => {});
        }

        function restartGame() {
            startGame();
        }

        function gameOver() {
            gameActive = false;
            gameState = 'gameover';
            spawnExplosion(player.x, player.y, 30, 8);
            explosionSound.currentTime = 0;
            explosionSound.play().catch(e => {});
            finalScoreElement.innerText = Math.floor(score);
            gameOverScreen.style.display = 'flex';
        }

        // Input
        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'Space') {
                e.preventDefault();
                shoot();
            }
            if (gameState === 'menu' && e.code === 'Space') {
                startGame();
            }
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        function update(timestamp) {
            if (!gameActive) return;

            const dt = timestamp - (update.lastTime || timestamp);
            update.lastTime = timestamp;

            updateDifficulty(dt);

            // Movement
            if (keys['ArrowLeft']) {
                player.vx -= player.speed;
                player.rotation = -0.3;
            } else if (keys['ArrowRight']) {
                player.vx += player.speed;
                player.rotation = 0.3;
            } else {
                player.vx *= 0.9;
                player.rotation *= 0.9;
            }

            player.x += player.vx;
            if (player.x < player.size) { player.x = player.size; player.vx = 0; }
            if (player.x > canvas.width - player.size) { player.x = canvas.width - player.size; player.vx = 0; }

            // Spawn asteroids
            if (timestamp - lastAsteroidTime > spawnInterval) {
                createAsteroidRow();
                lastAsteroidTime = timestamp;
            }

            // Update bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.y += b.vy;

                if (b.y < -10 || b.y > canvas.height + 10) {
                    bullets.splice(i, 1);
                    continue;
                }

                for (let j = asteroids.length - 1; j >= 0; j--) {
                    const a = asteroids[j];
                    const dx = b.x - a.x;
                    const dy = b.y - a.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < a.size + b.size) {
                        asteroids.splice(j, 1);
                        bullets.splice(i, 1);
                        score += 10;
                        scoreElement.innerText = Math.floor(score);

                        spawnExplosion(a.x, a.y, 15 + Math.floor(a.size / 2), a.size);
                        explosionSound.currentTime = 0;
                        explosionSound.play().catch(e => {});
                        break;
                    }
                }
            }

            // Update asteroids
            for (let i = asteroids.length - 1; i >= 0; i--) {
                const a = asteroids[i];
                a.y += a.vy;
                a.x += a.vx;
                a.rotation += a.rotationSpeed;

                // Bounce off walls
                if (a.x < -a.size * 2 || a.x > canvas.width + a.size * 2) {
                    a.vx *= -0.5;
                    a.x = Math.max(a.size, Math.min(canvas.width - a.size, a.x));
                }

                const dx = player.x - a.x;
                const dy = player.y - a.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < (player.size + a.size) * 0.8) {
                    gameOver();
                    return;
                }

                if (a.y > canvas.height + 60) {
                    asteroids.splice(i, 1);
                }
            }

            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vx *= 0.96;
                p.vy *= 0.96;
                p.life -= p.decay;
                p.size *= 0.98;

                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }

            score += 0.1;
            scoreElement.innerText = Math.floor(score);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Stars background (simple)
            if (!gameActive) {
                // Draw static background for menu
                return;
            }

            // Particles (draw behind asteroids)
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            // Bullets
            bullets.forEach(b => {
                ctx.fillStyle = '#ff0';
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(255, 255, 0, 0.4)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(b.x, b.y + b.size);
                ctx.lineTo(b.x, b.y + b.size + 14);
                ctx.stroke();
            });

            // Player
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.rotation);

            ctx.fillStyle = '#0ff';
            ctx.beginPath();
            ctx.moveTo(0, -player.size);
            ctx.lineTo(-player.size, player.size);
            ctx.lineTo(player.size, player.size);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(0, 0, player.size / 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#0ff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-player.size, player.size);
            ctx.lineTo(-player.size - 10, player.size + 5);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(player.size, player.size);
            ctx.lineTo(player.size + 10, player.size + 5);
            ctx.stroke();

            ctx.restore();

            // Asteroids
            asteroids.forEach(a => {
                ctx.save();
                ctx.translate(a.x, a.y);
                ctx.rotate(a.rotation);

                ctx.fillStyle = '#888';
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 2;

                ctx.beginPath();
                ctx.moveTo(a.points[0].x, a.points[0].y);
                for (let i = 1; i < a.points.length; i++) {
                    ctx.lineTo(a.points[i].x, a.points[i].y);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Glow
                ctx.shadowColor = 'rgba(255, 100, 0, 0.3)';
                ctx.shadowBlur = 5;
                ctx.restore();
                ctx.shadowBlur = 0;
            });
        }

        function gameLoop(timestamp) {
            update(timestamp);
            draw();
            requestAnimationFrame(gameLoop);
        }
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
